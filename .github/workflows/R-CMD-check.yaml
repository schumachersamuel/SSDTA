name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
      # brms/Stan is not installed in CI: it needs a C++ toolchain and long
      # compile times that don't belong in a per-PR check. The stan/stan_joint
      # engines are skipped here; glmm and conjugate (and everything
      # downstream of them -- standardization, comparison, the DiD module)
      # are fully exercised. Run the stan engines locally before a release.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run package self-tests
        run: |
          Rscript -e 'PKG_ROOT <- "."; Sys.setenv(PKG_ROOT = ".")'
          PKG_ROOT="$(pwd)" Rscript tests/run_tests.R
        shell: bash

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
          build_args: 'character()'
          error-on: '"warning"'
